services:
  data-permissions:
    image: docker.io/amazon/dynamodb-local:1.13.5
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown 1000:1000 /home/dynamodblocal/data"]
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
  dynamodb-local:
    image: docker.io/amazon/dynamodb-local:1.13.5
    depends_on:
      data-permissions:
        condition: service_completed_successfully
    command: -jar DynamoDBLocal.jar -dbPath /home/dynamodblocal/data
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${DYNAMODB_PORT:-8000}:8000"

volumes:
  dynamodb-data:
