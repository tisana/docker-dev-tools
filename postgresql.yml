services:
  db:
    image: docker.io/library/postgres:18.6
    environment:
      - POSTGRES_USER=metric
      - POSTGRES_PASSWORD=metric
    volumes:
      - postgresql-v18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
        - "${DEV_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
  # adminer:
  #   image: adminer
  #   restart: always
  #   ports:
  #     - 8080:8080

volumes:
  postgresql-v18-data:
  # postgresql_data:
