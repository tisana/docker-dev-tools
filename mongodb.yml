services:
    mongodb:
        image: docker.io/library/mongo:6
        ports:
            - "${DEV_BIND_ADDRESS:-127.0.0.1}:${MONGODB_PORT:-27017}:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: root
            MONGO_INITDB_ROOT_PASSWORD: localM0ng0
        volumes:
            - mongodb-data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
            interval: 5s
            timeout: 5s
            retries: 30
        # volumes:
        #     - ./data/mongodb/:/data/db/
    mongo-express:
        image: docker.io/library/mongo-express:latest
        depends_on:
            mongodb:
                condition: service_healthy
        ports:
            - "${DEV_BIND_ADDRESS:-127.0.0.1}:${MONGO_EXPRESS_PORT:-8081}:8081"
        environment:
            ME_CONFIG_MONGODB_ADMINUSERNAME: root
            ME_CONFIG_MONGODB_ADMINPASSWORD: localM0ng0
            ME_CONFIG_MONGODB_URL: "mongodb://root:localM0ng0@mongodb:27017/"

volumes:
    mongodb-data:
