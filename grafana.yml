services:
  grafana:
    image: docker.io/grafana/grafana:13.2.4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - grafana-v13-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=db:5432
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=grafana
      - GF_DATABASE_SSL_MODE=disable
      - GF_REMOTE_CACHE_TYPE=redis
      - GF_REMOTE_CACHE_CONNSTR=addr=redis:6379
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
  db:
    image: docker.io/library/postgres:17.11
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      - POSTGRES_DB=grafana
      - POSTGRES_PASSWORD=grafana
      - POSTGRES_USER=grafana
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - grafana-db-v17-data:/var/lib/postgresql/data/pgdata
    ports:
        - "${DEV_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_POSTGRES_PORT:-5432}:5432"
  redis:
    image: docker.io/library/redis:8.2.10
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30
    # ports:
    #   - 6379:6379
volumes:
  grafana-db-v17-data:
  grafana-v13-data:
