services:
  nexus3:
    image: docker.io/sonatype/nexus3
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${NEXUS_PORT:-8081}:8081"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./data/nexus-data:/nexus-data
