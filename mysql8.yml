services:
    mysql:
        image: docker.io/library/mysql:8
        volumes:
            - mysql8-data:/var/lib/mysql
        environment:
            # - MYSQL_USER=root
            - MYSQL_ROOT_PASSWORD=localSQL
            # - MYSQL_DATABASE=db-name
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
            interval: 5s
            timeout: 5s
            retries: 30
        ports:
            - "${DEV_BIND_ADDRESS:-127.0.0.1}:${MYSQL8_PORT:-3306}:3306"

    adminer:
      image: docker.io/library/adminer:4
      ports:
        - "${DEV_BIND_ADDRESS:-127.0.0.1}:${MYSQL8_ADMINER_PORT:-8080}:8080"

volumes:
    mysql8-data:
