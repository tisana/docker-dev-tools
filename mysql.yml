services:
    mysql:
        image: docker.io/library/mysql:8.4.11
        volumes:
            - ${MYSQL_DATA_DIR:-./data/mysql84}/:/var/lib/mysql/
        environment:
            # - MYSQL_USER=root
            - MYSQL_ROOT_PASSWORD=localSQL
            # - MYSQL_DATABASE=db-name
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
            interval: 5s
            timeout: 5s
            retries: 30
        ports:
            - "${DEV_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
        command: mysqld --lower_case_table_names=1 --character_set_server=utf8mb4 --explicit_defaults_for_timestamp

    adminer:
      image: docker.io/library/adminer:6.1.2
      ports:
        - "${DEV_BIND_ADDRESS:-127.0.0.1}:${MYSQL_ADMINER_PORT:-8080}:8080"
